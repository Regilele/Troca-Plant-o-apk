<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04262b" />
    <title>Offline — RG&amp;SA PLANTÃO</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(1200px 600px at 10% 0%, #0a4a52 0%, #04262b 55%, #021417 100%);
        color: #f2f7f6;
        padding: 24px;
      }
      .card {
        max-width: 460px;
        padding: 36px 30px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(18px);
        text-align: center;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 20px;
        display: grid; place-items: center; font-weight: 700; font-size: 22px;
        background: linear-gradient(135deg, #02a2af, #01696f);
        box-shadow: 0 10px 30px rgba(2, 162, 175, 0.45);
      }
      h1 { font-size: 1.5rem; margin: 0 0 10px; letter-spacing: -0.02em; }
      p { color: #b9cdcb; line-height: 1.6; margin: 0 0 22px; }
      button {
        border: 0; border-radius: 999px; padding: 13px 26px; font-size: 1rem; font-weight: 600;
        background: linear-gradient(135deg, #4dd0e1, #02a2af); color: #04262b; cursor: pointer;
      }
      small { display: block; margin-top: 18px; color: #8aa5a3; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">R&amp;</div>
      <h1>Você está offline</h1>
      <p>
        A escala que já foi aberta neste aparelho continua disponível. Assim que a conexão voltar, o app
        sincroniza automaticamente — sem perder nenhum plantão.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
      <small>RG&amp;SA PLANTÃO · PWA</small>
    </main>
  </body>
</html>
